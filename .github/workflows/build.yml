name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build distributable JAR
        run: bash ./gradlew build --console=plain
      - name: Test real singleplayer world
        run: xvfb-run -a bash ./gradlew runClientGameTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: gemstone-ores-26.2
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            build/reports/
            build/run/clientGameTest/
